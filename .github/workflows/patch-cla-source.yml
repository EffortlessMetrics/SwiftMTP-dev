name: Refresh bounded CLA source hash

on:
  push:
    branches:
      - chore/hosted-cla-assistant
    paths:
      - .github/workflows/patch-cla-source.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/hosted-cla-assistant
          fetch-depth: 0

      - name: Refresh canonical content hashes
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json

          source_path = Path("legal/inbound/CLA-ASSISTANT-SOURCE.json")
          source = json.loads(source_path.read_text(encoding="utf-8"))
          source["agreement"]["sha256"] = sha256(Path("legal/inbound/CLA-INDIVIDUAL.md").read_bytes()).hexdigest()
          source["metadata"]["sha256"] = sha256(Path("legal/inbound/CLA-ASSISTANT-METADATA.json").read_bytes()).hexdigest()
          source_path.write_text(json.dumps(source, indent=2) + "\n", encoding="utf-8")
          Path(".github/workflows/patch-cla-source.yml").unlink()
          print(f"CLA_SHA256={source['agreement']['sha256']}")
          print(f"METADATA_SHA256={source['metadata']['sha256']}")
          PY

      - name: Commit the source receipt and remove this workflow
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add legal/inbound/CLA-ASSISTANT-SOURCE.json .github/workflows/patch-cla-source.yml
          git commit -m "docs(cla): refresh agreement hash"
          git push origin HEAD:chore/hosted-cla-assistant
