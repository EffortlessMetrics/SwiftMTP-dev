name: Verify staged CLA migration
# Re-run after privacy-notice diff hygiene correction.

on:
  push:
    branches:
      - chore/hosted-cla-assistant
    paths:
      - .github/workflows/verify-cla-migration.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/hosted-cla-assistant
          fetch-depth: 0

      - name: Reconcile receipts and verify the staged migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json

          metadata_path = Path('legal/inbound/CLA-ASSISTANT-METADATA.json')
          source_path = Path('legal/inbound/CLA-ASSISTANT-SOURCE.json')
          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          source = json.loads(source_path.read_text(encoding='utf-8'))
          cla_hash = sha256(Path('legal/inbound/CLA-INDIVIDUAL.md').read_bytes()).hexdigest()
          metadata_hash = sha256(metadata_path.read_bytes()).hexdigest()
          source['agreement']['sha256'] = cla_hash
          source['metadata']['sha256'] = metadata_hash
          source_path.write_text(json.dumps(source, indent=2) + '\n', encoding='utf-8')

          assert set(metadata) == {'fullLegalName', 'email', 'individualAuthority'}
          assert all(metadata[key]['required'] is True for key in metadata)
          assert metadata['fullLegalName']['type'] == 'string'
          assert metadata['email']['type'] == 'string'
          assert metadata['individualAuthority']['type'] == 'boolean'
          assert source['activation_state'] == 'pending_hosted_service_configuration'
          assert source['agreement']['gist_url'] is None
          assert source['agreement']['gist_id'] is None
          assert source['agreement']['gist_revision'] is None
          assert source['allowlist'] == []
          assert Path('legal/inbound/CLA-ENTITY.md').is_file()
          assert Path('legal/inbound/DCO.txt').is_file()

          cla = ' '.join(Path('legal/inbound/CLA-INDIVIDUAL.md').read_text(encoding='utf-8').split())
          assert '(CLA-ENTITY.md)' in cla
          assert '(CLA-PRIVACY.md)' in cla
          privacy = ' '.join(Path('legal/inbound/CLA-PRIVACY.md').read_text(encoding='utf-8').split())
          assert 'not treated as active until' in privacy

          verifier = Path('.github/workflows/verify-cla-migration.yml')
          other_workflows = '\n'.join(
              path.read_text(encoding='utf-8')
              for path in Path('.github/workflows').glob('*.y*ml')
              if path != verifier
          )
          assert 'contributor-assistant/github-action' not in other_workflows
          print(f'CLA_SHA256={cla_hash}')
          print(f'METADATA_SHA256={metadata_hash}')
          print('staged_cla_migration=verified')
          PY
          git diff --quiet origin/main...HEAD -- legal/inbound/CLA-ENTITY.md legal/inbound/DCO.txt

      - name: Commit the reconciled receipt and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/verify-cla-migration.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add legal/inbound/CLA-ASSISTANT-SOURCE.json .github/workflows/verify-cla-migration.yml
          git commit -m "ci: record staged CLA verification"
          git push origin HEAD:chore/hosted-cla-assistant
